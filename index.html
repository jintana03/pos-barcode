<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1220" />
  <title>เลือกสาขา - POS สแกนบาร์โค้ด</title>
  <style>
    :root { font-family: system-ui, -apple-system, sans-serif; color: #172033; background: #f3f6fc; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; }
    main { width: min(680px, 100%); padding: 34px; border: 1px solid #e1e7f1; border-radius: 20px; background: #fff; box-shadow: 0 20px 60px rgba(26, 47, 92, .12); }
    .brand { display: flex; align-items: center; gap: 12px; }
    .mark { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 14px; color: #fff; background: #4f6bed; font-size: 24px; font-weight: 800; }
    h1 { margin: 26px 0 8px; font-size: clamp(24px, 5vw, 34px); }
    p { margin: 0; color: #68758a; }
    .stores { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 26px; }
    a { display: block; padding: 20px; border: 1px solid #dce4f3; border-radius: 14px; color: #172033; text-decoration: none; transition: .15s ease; }
    a:hover { border-color: #4f6bed; box-shadow: 0 8px 24px rgba(79, 107, 237, .14); transform: translateY(-2px); }
    a strong, a small { display: block; }
    a strong { font-size: 18px; }
    a small { margin-top: 6px; color: #718096; }
    @media (max-width: 560px) { main { padding: 24px; } .stores { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <div class="brand"><div class="mark">P</div><div><strong>POS สแกนบาร์โค้ด</strong><small>เลือกสาขาที่ต้องการใช้งาน</small></div></div>
    <h1>เลือกหน้าร้าน</h1>
    <p>ข้อมูลสินค้าและประวัติการขายของแต่ละร้านแยกออกจากกัน</p>
    <div class="stores">
      <a href="./kitpaisan/"><strong>กิจไพศาล</strong><small>เปิดจุดขายและสแกนบาร์โค้ด</small></a>
      <a href="./kitmongkol/"><strong>กิจมงคล</strong><small>เปิดจุดขายและสแกนบาร์โค้ด</small></a>
    </div>
  </main>
</body>
</html>
